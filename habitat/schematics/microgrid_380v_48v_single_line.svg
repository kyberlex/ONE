<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font-family: system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .box { rx: 6px; ry: 6px; stroke-width: 2px; }
      .box-hv { fill: #1e293b; stroke: #f59e0b; }
      .box-lv { fill: #1e293b; stroke: #06b6d4; }
      .box-tier1 { fill: #064e3b; stroke: #10b981; }
      .box-tier2 { fill: #451a03; stroke: #f97316; }
      .box-tier3 { fill: #4c0519; stroke: #f43f5e; }
      .box-ctrl { fill: #2e1065; stroke: #a855f7; }
      .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
      .sublabel { font-family: system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .line-hv { stroke: #f59e0b; stroke-width: 3px; fill: none; }
      .line-lv { stroke: #06b6d4; stroke-width: 3px; fill: none; }
      .line-comm { stroke: #a855f7; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
      .node-dot { fill: #f8fafc; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" class="bg"/>

  <!-- Header -->
  <text x="40" y="45" class="title">MHU DUAL-BUS DC CELLULAR MICROGRID — SINGLE-LINE SCHEMATIC</text>
  <text x="40" y="70" class="subtitle">Bioregional 380V DC Nanogrid Ring · Isolated Bidirectional DAB · Domestic 48V DC 3-Tier Priority Bus</text>

  <!-- 380V DC Ring Bus -->
  <line x1="60" y1="120" x2="940" y2="120" class="line-hv"/>
  <rect x="360" y="102" width="280" height="36" rx="4" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
  <text x="500" y="125" text-anchor="middle" class="label">BIOREGIONAL 380V DC NANOGRID RING BUS</text>

  <!-- High Voltage Disconnect & Protection -->
  <line x1="220" y1="120" x2="220" y2="180" class="line-hv"/>
  <rect x="140" y="180" width="160" height="50" class="box box-hv"/>
  <text x="220" y="202" text-anchor="middle" class="label">Q1: 2-POLE DC ISOLATOR</text>
  <text x="220" y="218" text-anchor="middle" class="sublabel">1000V DC / 32A (Icu=10kA)</text>

  <line x1="220" y1="230" x2="220" y2="270" class="line-hv"/>
  <circle cx="220" cy="275" r="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="220" y="279" text-anchor="middle" font-size="10" fill="#f59e0b" font-weight="700">F1</text>
  <text x="245" y="279" class="sublabel">Class-T 450V / 40A</text>

  <!-- Isolated DAB DC-DC Converter -->
  <line x1="220" y1="285" x2="220" y2="330" class="line-hv"/>
  <rect x="120" y="330" width="200" height="70" class="box box-hv"/>
  <text x="220" y="355" text-anchor="middle" class="label">U1: ISOLATED DAB DC-DC</text>
  <text x="220" y="372" text-anchor="middle" class="sublabel">380V ↔ 48V / 3.0 kW (η=97.5%)</text>
  <text x="220" y="388" text-anchor="middle" class="sublabel">4 kV RMS Galvanic Isolation</text>

  <!-- 48V DC Domestic Bus -->
  <line x1="220" y1="400" x2="220" y2="460" class="line-lv"/>
  <line x1="60" y1="460" x2="940" y2="460" class="line-lv"/>
  <rect x="360" y="442" width="280" height="36" rx="4" fill="#0e7490" stroke="#06b6d4" stroke-width="2"/>
  <text x="500" y="465" text-anchor="middle" class="label">DOMESTIC 48V DC LIFE-SUPPORT BUS</text>

  <!-- Battery Pack Subsystem (Left) -->
  <line x1="120" y1="460" x2="120" y2="520" class="line-lv"/>
  <rect x="40" y="520" width="160" height="90" class="box box-lv"/>
  <text x="120" y="545" text-anchor="middle" class="label">BAT1: 16S LiFePO4</text>
  <text x="120" y="565" text-anchor="middle" class="sublabel">15.36 kWh / 300 Ah</text>
  <text x="120" y="582" text-anchor="middle" class="sublabel">51.2V Nominal (Grade-A)</text>
  <text x="120" y="598" text-anchor="middle" font-size="10" fill="#10b981">Zero-Cobalt Prismatic</text>

  <!-- BMS and Cryo-Protection -->
  <rect x="230" y="520" width="160" height="90" class="box box-ctrl"/>
  <text x="310" y="545" text-anchor="middle" class="label">BMS1 + CRYO LOCK</text>
  <text x="310" y="565" text-anchor="middle" class="sublabel">RS485 Modbus RTU</text>
  <text x="310" y="582" text-anchor="middle" font-size="11" fill="#f43f5e">K1: Analog Lockout &lt; 2°C</text>
  <text x="310" y="598" text-anchor="middle" class="sublabel">Active Balancer 2A</text>
  <line x1="200" y1="565" x2="230" y2="565" class="line-comm"/>

  <!-- Tier 1 Loads (Never Shed) -->
  <line x1="480" y1="460" x2="480" y2="520" class="line-lv"/>
  <rect x="420" y="520" width="160" height="90" class="box box-tier1"/>
  <text x="500" y="543" text-anchor="middle" class="label">TIER 1 (NEVER SHED)</text>
  <text x="500" y="560" text-anchor="middle" class="sublabel">• Enthalpic HRV (28W)</text>
  <text x="500" y="575" text-anchor="middle" class="sublabel">• Cistern UV-C (12W)</text>
  <text x="500" y="590" text-anchor="middle" class="sublabel">• ESP32 Spine &amp; LoRa (12W)</text>
  <text x="500" y="604" text-anchor="middle" class="sublabel">• LED &amp; Cold Box (45W)</text>

  <!-- Tier 2 Loads (Shed < 25% SoC) -->
  <line x1="680" y1="460" x2="680" y2="520" class="line-lv"/>
  <rect x="610" y="520" width="160" height="90" class="box box-tier2"/>
  <text x="690" y="543" text-anchor="middle" class="label">TIER 2 (SHED &lt; 25% SoC)</text>
  <text x="690" y="560" text-anchor="middle" class="sublabel">K2: 80A Latching Relay</text>
  <text x="690" y="577" text-anchor="middle" class="sublabel">• R290 Heat Pump (650W)</text>
  <text x="690" y="593" text-anchor="middle" class="sublabel">• Induction Cooker (1.8kW)</text>
  <text x="690" y="607" text-anchor="middle" class="sublabel">• Domestic Hot Water</text>

  <!-- Tier 3 Loads (Shed < 50% SoC) -->
  <line x1="870" y1="460" x2="870" y2="520" class="line-lv"/>
  <rect x="800" y="520" width="160" height="90" class="box box-tier3"/>
  <text x="880" y="543" text-anchor="middle" class="label">TIER 3 (SHED &lt; 50% SoC)</text>
  <text x="880" y="560" text-anchor="middle" class="sublabel">K3: 63A Contactor</text>
  <text x="880" y="578" text-anchor="middle" class="sublabel">• FabLab CNC Router</text>
  <text x="880" y="595" text-anchor="middle" class="sublabel">• Auxiliary Power Tools</text>
  <text x="880" y="609" text-anchor="middle" class="sublabel">• High-Draw Comfort</text>

  <!-- ESP32 POE ISO Telemetry Gateway -->
  <rect x="520" y="220" width="220" height="90" class="box box-ctrl"/>
  <text x="630" y="245" text-anchor="middle" class="label">M1: ESP32-POE-ISO SPIINE</text>
  <text x="630" y="265" text-anchor="middle" class="sublabel">Wired 802.3af Ethernet (Isolated)</text>
  <text x="630" y="282" text-anchor="middle" class="sublabel">RS485 Modbus RTU Master</text>
  <text x="630" y="298" text-anchor="middle" font-size="11" fill="#10b981">100% Zero-Cloud Local Telemetry</text>

  <!-- Control lines -->
  <path d="M 630 310 L 630 380 L 310 380 L 310 520" class="line-comm"/>
  <path d="M 630 310 L 630 380 L 690 380 L 690 520" class="line-comm"/>
  <path d="M 630 310 L 630 380 L 880 380 L 880 520" class="line-comm"/>
</svg>