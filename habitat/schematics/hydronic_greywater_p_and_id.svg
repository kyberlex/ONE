<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d131a; }
      .grid { stroke: #1a2634; stroke-width: 1; }
      .box { fill: #131d28; stroke: #3a546e; stroke-width: 2; rx: 6; }
      .spine { fill: #101922; stroke: #4fd1c5; stroke-width: 2; stroke-dasharray: 6,4; rx: 8; }
      .title { font-family: monospace; font-size: 15px; font-weight: bold; fill: #e2e8f0; }
      .sub { font-family: monospace; font-size: 11px; fill: #94a3b8; }
      .label { font-family: monospace; font-size: 11px; font-weight: bold; fill: #f8fafc; }
      .cold { stroke: #38bdf8; stroke-width: 3; fill: none; }
      .preheat { stroke: #f59e0b; stroke-width: 3; fill: none; }
      .hot { stroke: #ef4444; stroke-width: 3; fill: none; }
      .grey { stroke: #22c55e; stroke-width: 3.5; fill: none; }
      .black { stroke: #a855f7; stroke-width: 3.5; fill: none; }
    </style>
  </defs>

  <rect class="bg" width="960" height="540"/>

  <!-- Header -->
  <text x="24" y="32" class="title">MHU 800x800mm UTILITY SPINE — HYDRONIC &amp; GREYWATER P&amp;ID (50-YEAR PASSIVE FAIL-SAFE)</text>
  <text x="24" y="50" class="sub">Standard: EN 806 / EN 1717 / EN 1111 | Zero Embedded Wall Pipes | Passive DWHR (η = 52%) | AGPL-3.0-or-later</text>

  <!-- 800x800mm Utility Spine Enclosure -->
  <rect x="24" y="70" width="912" height="440" class="spine"/>
  <text x="40" y="92" class="label" fill="#4fd1c5">800x800mm ACCESSIBLE DRY UTILITY SPINE (SHEARING LAYER 4: 30-50 YEAR SERVICEABILITY)</text>

  <!-- Port C: Potable Water In -->
  <rect x="45" y="130" width="160" height="75" class="box"/>
  <text x="58" y="154" class="label">PORT C: POTABLE IN</text>
  <text x="58" y="172" class="sub">DN32 PE100 + BF-1</text>
  <text x="58" y="188" class="sub">PRV-1 (3.0 bar) + UV-1</text>

  <!-- Cold Manifold -->
  <rect x="255" y="130" width="160" height="75" class="box"/>
  <text x="268" y="154" class="label">COLD PEX-a MANIFOLD</text>
  <text x="268" y="172" class="sub">Home-Run Radial</text>
  <text x="268" y="188" class="sub">Manual Quarter-Turn</text>

  <!-- DWHR-1 Coaxial Heat Exchanger -->
  <rect x="255" y="255" width="180" height="110" class="box"/>
  <text x="268" y="280" class="label">DWHR-1 HEAT RECOVERY</text>
  <text x="268" y="298" class="sub">Coaxial Cu Falling Film</text>
  <text x="268" y="314" class="sub">Cold: 10°C -&gt; 24°C</text>
  <text x="268" y="330" class="sub">Zero Moving Parts (η=52%)</text>

  <!-- DHW-1 R290 Tank & TMV-1 -->
  <rect x="495" y="130" width="190" height="100" class="box"/>
  <text x="508" y="154" class="label">DHW-1 (180L R290 HP)</text>
  <text x="508" y="172" class="sub">+ TMV-1 Wax Mixer</text>
  <text x="508" y="188" class="sub">EN 1111 Anti-Scald &lt;=48°C</text>
  <text x="508" y="204" class="sub">6.0 bar Mechanical T&amp;P</text>

  <!-- Wet-Room Fixtures -->
  <rect x="740" y="130" width="170" height="115" class="box"/>
  <text x="753" y="154" class="label">ISO 21542 WET-ROOM</text>
  <text x="753" y="174" class="sub">• Roll-In Shower</text>
  <text x="753" y="190" class="sub">• Washbasin &amp; Kitchen</text>
  <text x="753" y="206" class="sub">• 1.2L Low-Flush WC</text>

  <!-- Greywater Diverter V-DIV -->
  <rect x="495" y="310" width="190" height="90" class="box"/>
  <text x="508" y="334" class="label">V-DIV FROST BYPASS</text>
  <text x="508" y="352" class="sub">DN50 3-Way Brass Valve</text>
  <text x="508" y="368" class="sub">Wax Freeze Stat (&lt; +2°C)</text>
  <text x="508" y="384" class="sub">Reed Bed / Deep Drain</text>

  <!-- Port D Outputs -->
  <rect x="740" y="310" width="170" height="80" class="box"/>
  <text x="753" y="334" class="label">PORT D-1: GREYWATER</text>
  <text x="753" y="352" class="sub">DN110 PP -&gt; Reed Bed</text>
  <text x="753" y="368" class="sub">Subsurface Phragmites</text>

  <rect x="740" y="410" width="170" height="80" class="box"/>
  <text x="753" y="434" class="label">PORT D-2: BLACKWATER</text>
  <text x="753" y="452" class="sub">DN110 PP Independent</text>
  <text x="753" y="468" class="sub">-&gt; Anaerobic Digester</text>

  <!-- Piping Lines -->
  <path d="M 205 167 L 255 167" class="cold"/>
  <path d="M 335 205 L 335 255" class="cold"/>
  <path d="M 415 155 L 740 155" class="cold"/>
  <path d="M 435 290 L 495 190" class="preheat"/>
  <path d="M 685 180 L 740 180" class="hot"/>
  <path d="M 825 245 L 825 280 L 345 280 L 345 255" class="grey"/>
  <path d="M 435 340 L 495 340" class="grey"/>
  <path d="M 685 350 L 740 350" class="grey"/>
  <path d="M 880 245 L 880 410" class="black"/>

  <!-- Legend -->
  <text x="45" y="445" class="sub" fill="#38bdf8">━━ Cold Potable (10°C)</text>
  <text x="45" y="463" class="sub" fill="#f59e0b">━━ DWHR Preheated (24°C)</text>
  <text x="45" y="481" class="sub" fill="#ef4444">━━ TMV Tempered Hot (&lt;=48°C)</text>
  <text x="255" y="463" class="sub" fill="#22c55e">━━ Greywater Recovery Loop</text>
  <text x="255" y="481" class="sub" fill="#a855f7">━━ Blackwater Gravity Line</text>
</svg>

