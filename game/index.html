<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Open Networked Earth: A living longitudinal commons sandbox. From scratch to a thriving, self-reliant solarpunk community.">
  <meta name="theme-color" content="#070d12">
  <title>O.N.E. • The Living Commons Game</title>
  
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="app">
    <!-- Embarkation Screen (Milestone 1) -->
    <div id="embarkation-screen" class="screen-view active">
      <!-- Generated dynamically by embarkation.js -->
    </div>

    <!-- Main Game World View (Milestone 2+) -->
    <div id="game-world" class="screen-view hidden">
      <canvas id="village-canvas"></canvas>
      <div id="hud-overlay"></div>
      <div id="dock-overlay"></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
