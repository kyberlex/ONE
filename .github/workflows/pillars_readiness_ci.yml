name: Pillars Readiness & Habitat Specifications CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'habitat/**'
      - 'foundation/**'
      - 'roadmap/**'
      - 'stewards/**'
      - 'oasis/**'
      - 'scripts/**'
      - '.github/workflows/pillars_readiness_ci.yml'
  pull_request:
    paths:
      - 'habitat/**'
      - 'foundation/**'
      - 'roadmap/**'
      - 'stewards/**'
      - 'oasis/**'
      - 'scripts/**'
      - '.github/workflows/pillars_readiness_ci.yml'
  workflow_dispatch:

jobs:
  audit-pillars:
    name: Verify Pillars Readiness & Habitat Specifications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Habitat Specifications Test Suite
        run: |
          python3 habitat/test_habitat_specs.py

      - name: Run Co-Stewards & Pillars Readiness Gate
        run: |
          python3 scripts/verify_pillars_readiness.py

